{# Aparência ANTES do primeiro paint: tema, destaque, papel de parede, vidro e
   modo opaco vão para o <html> aqui, de forma síncrona — senão a página
   pisca no tema errado até o otc.js rodar. A preferência mora em
   __OTC_TRACKER_UI__ (o tema antigo, __OTCTRACKER_CONFIG__, é migrado uma vez). #}
<script>
(function () {
    var r = document.documentElement, p = null;
    try { p = JSON.parse(localStorage.getItem('__OTC_TRACKER_UI__') || 'null'); } catch (e) {}
    if (!p) {
        p = {};
        try {
            var o = JSON.parse(localStorage.getItem('__OTCTRACKER_CONFIG__') || 'null');
            if (o && o.theme) p.theme = o.theme === 'system' ? 'auto' : o.theme;
            localStorage.setItem('__OTC_TRACKER_UI__', JSON.stringify(p));
        } catch (e) {}
    }
    var th = p.theme || 'light';
    if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-bs-theme', th === 'dark' ? 'dark' : 'light');
    if (p.accent && p.accent !== 'blue') r.setAttribute('data-accent', p.accent);
    if (p.wall && p.wall !== 'ash') r.setAttribute('data-wall', p.wall);
    if (p.glass === 'clear') r.setAttribute('data-glass', 'clear');
    var fx = '', auto = null;
    try { fx = localStorage.getItem('__OTC_TRACKER_FX__') || ''; auto = sessionStorage.getItem('__OTC_FX_AUTO__'); } catch (e) {}
    // automático = sem GPU (sonda do otc.js, memoizada na sessão) OU o sistema
    // pedindo menos transparência; 'full'/'reduced' gravados vencem os dois
    var lessGlass = !!(window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches);
    if (fx === 'reduced' || (fx !== 'full' && (auto === '1' || lessGlass))) r.classList.add('is-solid');
    // Troca de PÁGINA como a do Pane (§632): a View Transition entre documentos
    // (`@view-transition` no otc.scss) segura barra lateral, barra do topo e papel
    // de parede no lugar e esmaece só o conteúdo; a classe dá os nomes às três
    // só durante a navegação (na troca de tema elas cruzam com o resto). O
    // `pagereveal` tem de estar ouvindo ANTES do primeiro paint — por isso aqui.
    // No modo opaco (máquina sem GPU, as do JPM) a transição é PULADA: ela
    // fotografa a página que sai e a que entra, e por software isso é parte do
    // segundo que a troca de página levava lá (medido com a CPU 6× mais lenta).
    addEventListener('pageswap', function (e) {
        if (!e.viewTransition) return;
        if (r.classList.contains('is-solid')) { e.viewTransition.skipTransition(); return; }
        r.classList.add('otc-vt-nav');
    });
    addEventListener('pagereveal', function (e) {
        if (!e.viewTransition) return;
        if (r.classList.contains('is-solid')) { e.viewTransition.skipTransition(); return; }
        r.classList.add('otc-vt-nav');
        e.viewTransition.finished.finally(function () { r.classList.remove('otc-vt-nav'); });
    });
})();
</script>
