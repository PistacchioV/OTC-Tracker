{# Aparência ANTES do primeiro paint: tema, destaque, papel de parede, vidro e
   modo opaco vão para o <html> aqui, de forma síncrona — senão a página
   pisca no tema errado até o otc.js rodar. A preferência mora em
   __OTC_TRACKER_UI__ (o tema antigo, __OTCTRACKER_CONFIG__, é migrado uma vez). #}
<script>
(function () {
    var r = document.documentElement, p = null;
    try { p = JSON.parse(localStorage.getItem('__OTC_TRACKER_UI__') || 'null'); } catch (e) {}
    if (!p) {
        p = {};
        try {
            var o = JSON.parse(localStorage.getItem('__OTCTRACKER_CONFIG__') || 'null');
            if (o && o.theme) p.theme = o.theme === 'system' ? 'auto' : o.theme;
            localStorage.setItem('__OTC_TRACKER_UI__', JSON.stringify(p));
        } catch (e) {}
    }
    // paredes RETIRADAS (22/10/2026: não combinavam com a paleta do sistema;
    // as lisas viraram as cores dela): quem as tinha escolhido volta à padrão
    // (`aurora`), GRAVADO — senão o `data-wall` ficaria
    // apontando para uma paleta que não existe, sem miniatura marcada na
    // gaveta e com o nome cru na Settings
    var retiradas = { ash: 1, sand: 1, sage: 1, bloom: 1, ember: 1, grove: 1, canyon: 1 };
    if (p.wall && retiradas[p.wall]) {
        delete p.wall;
        try { localStorage.setItem('__OTC_TRACKER_UI__', JSON.stringify(p)); } catch (e) {}
    }
    var th = p.theme || 'light';
    if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-bs-theme', th === 'dark' ? 'dark' : 'light');
    if (p.accent && p.accent !== 'blue') r.setAttribute('data-accent', p.accent);
    // padrão de quem nunca escolheu: Aurora com o vidro Clear (26/10/2026). A
    // `frost` é a parede SEM `data-wall` (o `:root` do otc.scss §2b) — o
    // WALL_BASE/WALL_DEFAULT do otc.js, que tem de dizer o mesmo.
    var wall = p.wall || 'aurora';
    if (wall !== 'frost') r.setAttribute('data-wall', wall);
    if ((p.glass || 'clear') === 'clear') r.setAttribute('data-glass', 'clear');
    var fx = '', auto = null;
    try { fx = localStorage.getItem('__OTC_TRACKER_FX__') || ''; auto = sessionStorage.getItem('__OTC_FX_AUTO__'); } catch (e) {}
    // automático = sem GPU (sonda do otc.js, memoizada na sessão) OU o sistema
    // pedindo menos transparência; 'full'/'reduced' gravados vencem os dois
    var lessGlass = !!(window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches);
    if (fx === 'reduced' || (fx !== 'full' && (auto === '1' || lessGlass))) r.classList.add('is-solid');
    // Troca de PÁGINA como a do Pane (§632): a View Transition entre documentos
    // (`@view-transition` no otc.scss) segura barra lateral, barra do topo e papel
    // de parede no lugar e esmaece só o conteúdo; a classe dá os nomes às três
    // só durante a navegação (na troca de tema elas cruzam com o resto). O
    // `pagereveal` tem de estar ouvindo ANTES do primeiro paint — por isso aqui.
    // No modo opaco (máquina sem GPU, as do JPM) a transição é PULADA: ela
    // fotografa a página que sai e a que entra, e por software isso é parte do
    // segundo que a troca de página levava lá (medido com a CPU 6× mais lenta).
    // Pular REJEITA a promessa `ready` da transição: sem o `catch`, cada troca de
    // página no modo opaco deixava um "Transition was skipped" no console (§723).
    function pula(vt) { if (vt.ready) vt.ready.catch(function () {}); vt.skipTransition(); }
    // A página nova MONTA em degraus depois da primeira pintura: a placa, a
    // barra e a tabela vazia, os dados (por fetch), e a cada degrau a placa muda
    // de tamanho (§728). Durante a transição a FOTO da página antiga fica parada
    // por cima (`otc-vt-hold` pausa o esmaecer dela) enquanto a nova termina de
    // montar por baixo; quando assenta — nenhuma requisição em voo há 150 ms e
    // nenhuma tabela assentando — ou no teto de 1,6 s, a antiga esmaece de uma
    // vez sobre a página pronta. As requisições se contam aqui, antes de
    // qualquer script da página.
    var voo = 0, mexeu = Date.now();
    function conta(d) { voo += d; mexeu = Date.now(); }
    if (window.fetch) {
        var f0 = window.fetch;
        window.fetch = function () {
            conta(1);
            var p = f0.apply(this, arguments);
            p.then(function () { conta(-1); }, function () { conta(-1); });
            return p;
        };
    }
    if (window.XMLHttpRequest) {
        var s0 = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function () {
            conta(1);
            this.addEventListener('loadend', function () { conta(-1); }, { once: true });
            return s0.apply(this, arguments);
        };
    }
    function segura(vt) {
        r.classList.add('otc-vt-hold');
        var t0 = Date.now();
        (function olha() {
            var pronta = document.readyState === 'complete' && voo <= 0 && Date.now() - mexeu >= 150 &&
                !document.querySelector('.dt-container.oxf-settling');
            if (pronta || Date.now() - t0 >= 1600) {
                // o rastro fica na página (o check_page_transition o lê)
                window.__otcVtHold = { ms: Date.now() - t0, em: Math.round(performance.now()), motivo: pronta ? 'pronta' : 'teto', voo: voo };
                r.classList.remove('otc-vt-hold');
                return;
            }
            requestAnimationFrame(olha);
        })();
        vt.finished.finally(function () { r.classList.remove('otc-vt-hold'); });
    }
    addEventListener('pageswap', function (e) {
        if (!e.viewTransition) return;
        if (r.classList.contains('is-solid')) { pula(e.viewTransition); return; }
        r.classList.add('otc-vt-nav');
        // a foto da página que sai é tirada logo depois deste evento: a pílula
        // do menu ainda deslizando até o item clicado sairia no meio do caminho
        // (§728), e a cor do texto do item também — termina tudo do menu AGORA
        var side = document.querySelector('.sidenav-menu');
        if (side && side.getAnimations) side.getAnimations({ subtree: true }).forEach(function (a) {
            try { a.finish(); } catch (er) { /* animação infinita (spinner): fica */ }
        });
    });
    addEventListener('pagereveal', function (e) {
        if (!e.viewTransition) return;
        if (r.classList.contains('is-solid')) { pula(e.viewTransition); return; }
        r.classList.add('otc-vt-nav');
        segura(e.viewTransition);
        e.viewTransition.finished.finally(function () { r.classList.remove('otc-vt-nav'); });
    });
})();
</script>
